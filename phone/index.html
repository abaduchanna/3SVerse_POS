function openUserModal(id){imgBuf.uImg=undefined;const u=id?USERS.find(x=>x.id===id):{employeeId:'',role:'Cashier',firstName:'',lastName:'',email:'',password:'',department:'',shiftType:'Morning',rotationalShift:'No',perms:{sales:true,customers:true},active:true,img:''};modal(`<div class="modal-head"><h3>${id?'Edit':'Add'} Employee</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="row2"><div class="field"><label>Employee ID *</label><input id="uEid" value="${esc(u.employeeId||'')}" placeholder="e.g. EMP002"></div><div class="field"><label>Role *</label><select id="uRole">${['Cashier','Supervisor','Manager','Stock Keeper','Accountant','Other'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div><div class="row2"><div class="field"><label>First Name *</label><input id="uFirst" value="${esc(u.firstName||'')}"></div><div class="field"><label>Last Name</label><input id="uLast" value="${esc(u.lastName||'')}"></div></div><div class="row2"><div class="field"><label>Email *</label><input id="uEmail" value="${esc(u.email||'')}" placeholder="name@store.com"></div><div class="field"><label>Password *</label><input id="uPass" value="${esc(u.password||'')}"></div></div><div class="row3"><div class="field"><label>Department *</label><input id="uDept" value="${esc(u.department||'')}" placeholder="e.g. Sales"></div><div class="field"><label>Shift Type *</label><select id="uShift">${['Morning','Evening','Night','Full Day'].map(s=>`<option ${u.shiftType===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Rotational Shift</label><select id="uRot"><option ${u.rotationalShift==='No'?'selected':''}>No</option><option ${u.rotationalShift==='Yes'?'selected':''}>Yes</option></select></div></div><div class="field"><label>Photo</label><input type="file" accept="image/*" onchange="readImg(this,'uImg')"><div id="uImgPrev">${u.img?`<img src="${u.img}" style="height:54px;border-radius:50%;object-fit:cover;margin-top:6px">`:''}</div></div><div class="field"><label>Permissions — tick what this employee may access</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px">${PERMS.map(p=>`<label style="display:flex;gap:8px;align-items:center;font-size:13px;background:var(--panel2);padding:9px;border-radius:8px"><input type="checkbox" class="permchk" data-k="${p.k}" ${u.perms&&u.perms[p.k]?'checked':''} style="width:auto"> ${p.label}</label>`).join('')}</div></div><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="uActive" ${u.active!==false?'checked':''} style="width:auto"> Active (can log in)</label></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="saveUser('${id||''}')">Save</button></div>`);}
function readImg(input,key){const f=input.files[0];if(!f)return;if(f.size>1500000){toast('Image too large (max ~1.5MB)',true);return}const r=new FileReader();r.onload=()=>{imgBuf[key]=r.result;const prev=document.getElementById(key+'Prev');if(prev)prev.innerHTML='<img src="'+r.result+'" style="height:54px;border-radius:8px;object-fit:cover;margin-top:6px">';};r.readAsDataURL(f)}
function saveUser(id){const first=document.getElementById('uFirst').value.trim();const last=document.getElementById('uLast').value.trim();const email=document.getElementById('uEmail').value.trim();if(!first||!email){toast('First name and email are required',true);return}if(!document.getElementById('uPass').value){toast('Password is required',true);return}const perms={};document.querySelectorAll('.permchk').forEach(c=>{if(c.checked)perms[c.dataset.k]=true});const ex=id?USERS.find(u=>u.id===id):null;const img=imgBuf.uImg!==undefined?imgBuf.uImg:(ex?ex.img:'');const data={employeeId:document.getElementById('uEid').value.trim(),role:document.getElementById('uRole').value,firstName:first,lastName:last,name:(first+' '+last).trim(),email,password:document.getElementById('uPass').value,department:document.getElementById('uDept').value.trim(),shiftType:document.getElementById('uShift').value,rotationalShift:document.getElementById('uRot').value,perms,active:document.getElementById('uActive').checked,img};if(id){Object.assign(ex,data)}else{USERS.push({id:uid('u'),...data})}save();closeModal();renderUsers();toast('Employee saved');}
function deleteUser(id){if(!confirm('Delete this employee?'))return;USERS=USERS.filter(u=>u.id!==id);save();renderUsers();toast('Deleted')}
function saveAdmin(){S.adminName=document.getElementById('admName').value.trim()||'Owner';S.adminEmail=document.getElementById('admEmail').value.trim()||'admin';S.adminPassword=document.getElementById('admPass').value;S.requireLogin=document.getElementById('reqLogin').checked;save();updateUserChip();toast('Admin settings saved')}

function renderSales(){document.getElementById('view-sales').innerHTML=`<div class="toolbar"><input id="saleSearch" placeholder="🔍 Search invoice / customer…" style="max-width:260px" oninput="renderSales2()"><select id="saleFilter" style="max-width:150px" onchange="renderSales2()"><option value="all">All time</option><option value="today">Today</option><option value="week">Last 7 days</option><option value="month">This month</option></select><span class="spacer"></span><button class="barbtn blue" onclick="exportSalesExcel()">⬇ Export Excel</button></div><div class="tablewrap"><table id="salesTable"></table></div>`;renderSales2();}
function filteredSales(){const f=document.getElementById('saleFilter')?.value||'all';const q=(document.getElementById('saleSearch')?.value||'').toLowerCase();let list=SALES.slice();const now=new Date();if(f==='today')list=list.filter(s=>s.time>=todayStart());if(f==='week')list=list.filter(s=>s.time>=Date.now()-7*86400000);if(f==='month')list=list.filter(s=>{const d=new Date(s.time);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});if(q)list=list.filter(s=>{const c=CUSTOMERS.find(x=>x.id===s.customer)||{};return (s.invoice+' '+(c.name||'')).toLowerCase().includes(q)});return list;}
function renderSales2(){const list=filteredSales();const total=list.filter(s=>s.status!=='refunded').reduce((a,s)=>a+s.grand,0);document.getElementById('salesTable').innerHTML=`<thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Cashier</th><th>Payment</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${list.length?list.map(s=>{const c=CUSTOMERS.find(x=>x.id===s.customer)||{name:'—'};const st=s.status==='refunded'?'<span class="tag red">Returned</span>':'<span class="tag green">Completed</span>';return `<tr><td><b>${esc(s.invoice)}</b></td><td>${new Date(s.time).toLocaleString([], {dateStyle:'short',timeStyle:'short'})}</td><td>${esc(c.name)}</td><td>${esc(s.cashier||'—')}</td><td><span class="tag blue">${esc(s.method)}</span></td><td><b>${money(s.grand)}</b></td><td>${st}</td><td style="white-space:nowrap"><button class="barbtn" style="padding:5px 9px" onclick="reopenReceipt('${s.id}')">🧾</button>${(s.status!=='refunded'&&can('refunds'))?`<button class="barbtn" style="padding:5px 9px" onclick="editInvoice('${s.id}')">✏️</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="8"><div class="empty">No sales found</div></td></tr>'}${list.length?`<tr style="background:var(--panel2)"><td colspan="5"><b>Total (${list.length})</b></td><td colspan="3"><b>${money(total)}</b></td></tr>`:''}</tbody>`;}
function reopenReceipt(id){const s=SALES.find(x=>x.id===id);if(s)showReceipt(s)}

function renderReports(){const v=document.getElementById('view-reports');const valid=SALES.filter(s=>s.status!=='refunded');const today=valid.filter(s=>s.time>=todayStart());const zTotal=today.reduce((a,s)=>a+s.grand,0);const zTax=today.reduce((a,s)=>a+s.taxTotal,0);const byMethod={};valid.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.grand);const todayByMethod={};today.forEach(s=>todayByMethod[s.method]=(todayByMethod[s.method]||0)+s.grand);const taxBreak={};valid.forEach(s=>Object.entries(s.taxMap).forEach(([k,val])=>taxBreak[k]=(taxBreak[k]||0)+val));let revenue=0,cogs=0;valid.forEach(s=>s.items.forEach(it=>{revenue+=it.price*it.qty-(it.lineDisc||0);const p=PRODUCTS.find(x=>x.id===it.id);cogs+=(p?p.cost:0)*it.qty*(it.pcs||1)}));const profit=revenue-cogs;const byCashier={};valid.forEach(s=>byCashier[s.cashier||'—']=(byCashier[s.cashier||'—']||0)+s.grand);const lostVal=LOST.reduce((a,l)=>a+(l.value||0),0);v.innerHTML=`<div class="toolbar"><b style="font-size:15px">📊 Reports</b><span class="spacer"></span><button class="barbtn blue" onclick="exportFullReport()">⬇ Export Full Report (Excel)</button></div><div class="row2"><div class="panel"><h3>🧾 Daily Z-Report — ${new Date().toLocaleDateString()}</h3><table><tr><td>Gross Sales</td><td style="text-align:right"><b>${money(zTotal)}</b></td></tr><tr><td>Transactions</td><td style="text-align:right">${today.length}</td></tr><tr><td>Tax Collected</td><td style="text-align:right">${money(zTax)}</td></tr><tr><td>Net of Tax</td><td style="text-align:right">${money(zTotal-zTax)}</td></tr><tr style="border-top:1px solid var(--line)"><td colspan="2" style="padding-top:8px;color:var(--muted)">By Payment Method</td></tr>${Object.entries(todayByMethod).map(([m,v2])=>`<tr><td>${esc(m)}</td><td style="text-align:right">${money(v2)}</td></tr>`).join('')||'<tr><td colspan="2"><div class="empty">No sales today</div></td></tr>'}</table><button class="barbtn blue" style="margin-top:12px;width:100%" onclick="printZReport()">🖨 Print Z-Report</button></div><div class="panel"><h3>💰 Profit Snapshot</h3><table><tr><td>Revenue (net of tax)</td><td style="text-align:right"><b>${money(revenue)}</b></td></tr><tr><td>Cost of Goods Sold</td><td style="text-align:right">${money(cogs)}</td></tr><tr style="border-top:2px solid var(--line);font-size:16px"><td style="padding-top:8px"><b>Gross Profit</b></td><td style="text-align:right;padding-top:8px;color:var(--accent)"><b>${money(profit)}</b></td></tr><tr><td>Margin</td><td style="text-align:right">${revenue>0?Math.round(profit/revenue*100):0}%</td></tr></table><h3 style="margin-top:16px">🧑‍💼 Sales by Cashier</h3><table><tbody>${Object.entries(byCashier).map(([m,v2])=>`<tr><td>${esc(m)}</td><td style="text-align:right">${money(v2)}</td></tr>`).join('')||'<tr><td><div class="empty">No data</div></td></tr>'}</tbody></table></div></div><div class="row2"><div class="panel"><h3>📊 Tax Liability Breakdown</h3><table><thead><tr><th>Tax Slab</th><th style="text-align:right">Collected</th></tr></thead><tbody>${Object.entries(taxBreak).filter(([k,v2])=>v2>0.01).map(([k,v2])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${money(v2)}</td></tr>`).join('')||'<tr><td colspan="2"><div class="empty">No data</div></td></tr>'}<tr style="border-top:2px solid var(--line);font-weight:700"><td>Total GST Payable</td><td style="text-align:right">${money(Object.values(taxBreak).reduce((a,b)=>a+b,0))}</td></tr></tbody></table></div><div class="panel"><h3>📉 Lost Sales (${LOST.length}) — est. ${money(lostVal)}</h3><div class="tablewrap" style="max-height:240px"><table><thead><tr><th>Item</th><th>Qty</th><th>Reason</th><th>By</th><th></th></tr></thead><tbody>${LOST.length?LOST.slice(0,50).map(l=>`<tr><td>${esc(l.item)}</td><td>${l.qty}</td><td>${esc(l.reason)}</td><td>${esc(l.user||'')}</td><td><button class="ci-del" onclick="deleteLost('${l.id}')">🗑</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No lost sales recorded</div></td></tr>'}</tbody></table></div></div></div>`;}
function deleteLost(id){LOST=LOST.filter(l=>l.id!==id);save();renderReports();}
function printZReport(){const today=SALES.filter(s=>s.time>=todayStart()&&s.status!=='refunded');const zTotal=today.reduce((a,s)=>a+s.grand,0);const zTax=today.reduce((a,s)=>a+s.taxTotal,0);const byMethod={};today.forEach(s=>byMethod[s.method]=(byMethod[s.method]||0)+s.grand);const html=`<div style="width:272px;margin:0 auto;font-family:'Courier New',monospace;font-size:12px;padding:6px 8px"><div style="text-align:center;font-weight:800;font-size:16px">${esc(S.storeName)}</div><div style="text-align:center;border-bottom:1px dashed #000;padding-bottom:6px">DAILY Z-REPORT<br>${new Date().toLocaleString()}</div><table style="width:100%;margin-top:6px"><tr><td>Gross Sales</td><td style="text-align:right">${money(zTotal)}</td></tr><tr><td>Transactions</td><td style="text-align:right">${today.length}</td></tr><tr><td>Tax Collected</td><td style="text-align:right">${money(zTax)}</td></tr><tr><td>Net of Tax</td><td style="text-align:right">${money(zTotal-zTax)}</td></tr><tr><td colspan=2 style="border-top:1px dashed #000;padding-top:5px">PAYMENTS</td></tr>${Object.entries(byMethod).map(([m,v])=>`<tr><td>${esc(m)}</td><td style="text-align:right">${money(v)}</td></tr>`).join('')}</table><div style="text-align:center;border-top:1px dashed #000;margin-top:6px;padding-top:5px">End of Day Report</div></div>`;const w=window.open('','_blank','width=320,height=600');w.document.write(`<html><head><style>@page{size:80mm auto;margin:0}body{margin:0;width:80mm}</style></head><body onload="window.print();setTimeout(()=>window.close(),400)">${html}</body></html>`);w.document.close();}

/* ===== EXCEL (professional: logo cell, centered title block, frozen header, autofilter, number formats) ===== */
function accentHex(){return (S.accent||(SCHEMES[S.scheme]||{}).accent)||'#22c55e'}
function argb(hex){return 'FF'+(hex||'#22c55e').replace('#','').toUpperCase().slice(0,6)}
function bord(){const s={style:'thin',color:{argb:'FFD0D5DD'}};return {top:s,left:s,bottom:s,right:s}}
async function buildWorkbook(sheets,filename){
  if(typeof ExcelJS==='undefined'){toast('Excel needs internet the first time it loads',true);return}
  const wb=new ExcelJS.Workbook();wb.creator='3S Verse POS';
  let logoId=null;
  if(S.logo){try{const ext=/png/i.test(S.logo.slice(0,20))?'png':'jpeg';const b64=S.logo.split(',')[1]||S.logo;logoId=wb.addImage({base64:b64,extension:ext});}catch(e){}}
  sheets.forEach(sh=>{
    const ws=wb.addWorksheet(sh.name,{views:[{state:'frozen',ySplit:6}]});const nc=sh.columns.length;
    ws.getColumn(1).width=20;
    for(let i=2;i<=nc;i++)ws.getColumn(i).width=15;
    // logo box in A1:A4
    if(logoId!==null){try{ws.addImage(logoId,{tl:{col:0.15,row:0.1},ext:{width:120,height:84}});}catch(e){}}
    const tStart=nc>1?2:1, tEnd=Math.max(tStart,nc);
    ws.mergeCells(1,tStart,1,tEnd);ws.mergeCells(2,tStart,2,tEnd);ws.mergeCells(3,tStart,3,tEnd);ws.mergeCells(4,tStart,4,tEnd);
    const c1=ws.getCell(1,tStart);c1.value=S.storeName;c1.font={bold:true,size:16,color:{argb:argb(accentHex())}};c1.alignment={horizontal:'center',vertical:'middle'};
    const c2=ws.getCell(2,tStart);c2.value=sh.title;c2.font={bold:true,size:12};c2.alignment={horizontal:'center',vertical:'middle'};
    const c3=ws.getCell(3,tStart);c3.value=S.address+'  ·  Tel: '+S.phone+(S.ntn?'  ·  NTN: '+S.ntn:'');c3.font={size:10,color:{argb:'FF555555'}};c3.alignment={horizontal:'center',vertical:'middle'};
    const c4=ws.getCell(4,tStart);c4.value='Generated: '+new Date().toLocaleString();c4.font={size:9,italic:true,color:{argb:'FF888888'}};c4.alignment={horizontal:'center',vertical:'middle'};
    ws.getRow(1).height=24;ws.getRow(2).height=18;ws.getRow(3).height=15;ws.getRow(4).height=14;ws.getRow(5).height=6;
    let r=6;const hr=ws.getRow(r);
    sh.columns.forEach((c,i)=>{const cell=hr.getCell(i+1);cell.value=c;cell.font={bold:true,color:{argb:'FFFFFFFF'},size:11};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:argb(accentHex())}};cell.alignment={horizontal:'center',vertical:'middle'};cell.border=bord();});
    hr.height=22;
    ws.autoFilter={from:{row:6,column:1},to:{row:6,column:nc}};
    r++;
    sh.rows.forEach((row,ri)=>{const rr=ws.getRow(r++);row.forEach((val,i)=>{const cell=rr.getCell(i+1);cell.value=val;cell.border=bord();if(ri%2===1)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF6F8FA'}};if(typeof val==='number'){cell.alignment={horizontal:'right'};cell.numFmt='#,##0';}});});
    if(sh.total){const tr=ws.getRow(r++);sh.total.forEach((val,i)=>{const cell=tr.getCell(i+1);cell.value=val;cell.font={bold:true};cell.border=bord();cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8EBEF'}};if(typeof val==='number'){cell.alignment={horizontal:'right'};cell.numFmt='#,##0';}});}
    sh.columns.forEach((c,i)=>{if(i===0){ws.getColumn(1).width=Math.max(20,String(c).length+2);return}let w=Math.max(String(c).length+2,12);sh.rows.forEach(row=>{const s=String(row[i]==null?'':row[i]);if(s.length+2>w)w=s.length+2});ws.getColumn(i+1).width=Math.min(w,40)});
  });
  try{const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();toast('Excel exported');}catch(e){toast('Export failed',true)}
}
function exportSalesExcel(){const list=filteredSales();const cols=['Invoice','Date','Customer','Cashier','Payment','Subtotal','Discount','Tax','Total','Status'];const rows=list.map(s=>{const c=CUSTOMERS.find(x=>x.id===s.customer)||{};return [s.invoice,new Date(s.time).toLocaleString(),c.name||'',s.cashier||'',s.method,Math.round(s.sub),Math.round(s.discAmt),Math.round(s.taxTotal),Math.round(s.grand),s.status]});const total=list.filter(s=>s.status!=='refunded').reduce((a,s)=>a+s.grand,0);buildWorkbook([{name:'Sales',title:'Sales Report',columns:cols,rows,total:['TOTAL','','','','','','','',Math.round(total),'']}],'3SVerse-Sales-'+new Date().toISOString().slice(0,10)+'.xlsx');}
function exportProductsExcel(){const cols=['Name','SKU','Barcode','Category','Cost','Price','Pcs/Box','Tax %','Stock','Stock Value'];const rows=PRODUCTS.map(p=>[p.name,p.sku,p.barcode,p.cat,p.cost,p.price,p.piecesPerBox||1,taxById(p.taxId).rate,p.stock,Math.round(p.cost*p.stock)]);buildWorkbook([{name:'Inventory',title:'Inventory / Stock Report',columns:cols,rows}],'3SVerse-Inventory-'+new Date().toISOString().slice(0,10)+'.xlsx');}
function exportFullReport(){const valid=SALES.filter(s=>s.status!=='refunded');const salesCols=['Invoice','Date','Customer','Cashier','Payment','Subtotal','Discount','Tax','Total','Status'];const salesRows=SALES.map(s=>{const c=CUSTOMERS.find(x=>x.id===s.customer)||{};return [s.invoice,new Date(s.time).toLocaleString(),c.name||'',s.cashier||'',s.method,Math.round(s.sub),Math.round(s.discAmt),Math.round(s.taxTotal),Math.round(s.grand),s.status]});const prodCols=['Name','SKU','Category','Cost','Price','Pcs/Box','Tax %','Stock','Stock Value'];const prodRows=PRODUCTS.map(p=>[p.name,p.sku,p.cat,p.cost,p.price,p.piecesPerBox||1,taxById(p.taxId).rate,p.stock,Math.round(p.cost*p.stock)]);const taxBreak={};valid.forEach(s=>Object.entries(s.taxMap).forEach(([k,val])=>taxBreak[k]=(taxBreak[k]||0)+val));const taxRows=Object.entries(taxBreak).map(([k,v])=>[k,Math.round(v)]);const lostRows=LOST.map(l=>[new Date(l.time).toLocaleString(),l.item,l.qty,l.reason,Math.round(l.value||0),l.user||'']);const byCashier={};valid.forEach(s=>byCashier[s.cashier||'—']=(byCashier[s.cashier||'—']||0)+s.grand);const cashRows=Object.entries(byCashier).map(([k,v])=>[k,Math.round(v)]);buildWorkbook([{name:'Sales',title:'Sales Report',columns:salesCols,rows:salesRows},{name:'Inventory',title:'Inventory / Stock Report',columns:prodCols,rows:prodRows},{name:'Tax Summary',title:'GST / Tax Liability',columns:['Tax Slab','Collected'],rows:taxRows,total:['TOTAL',taxRows.reduce((a,r)=>a+r[1],0)]},{name:'By Cashier',title:'Sales by Cashier',columns:['Cashier','Total Sales'],rows:cashRows},{name:'Lost Sales',title:'Lost Sales Log',columns:['Date','Item','Qty','Reason','Est. Value','By'],rows:lostRows}],'3SVerse-Full-Report-'+new Date().toISOString().slice(0,10)+'.xlsx');}

function renderDisplay(){imgBuf.logoImg=undefined;document.getElementById('view-display').innerHTML=`<div class="row2"><div class="panel"><h3>🖼️ Store Logo (invoice, reports & login)</h3><div id="logoImgPrev" style="margin-bottom:10px">${S.logo?`<img src="${S.logo}" style="max-height:80px;background:#fff;padding:6px;border-radius:8px">`:'<div class="help">No logo uploaded yet.</div>'}</div><input type="file" accept="image/*" onchange="readImg(this,'logoImg')"><div class="btnrow" style="margin-top:10px"><button class="barbtn green" onclick="saveLogo()">Save Logo</button>${S.logo?'<button class="barbtn red" onclick="removeLogo()">Remove</button>':''}</div></div><div class="panel"><h3>🌓 Quick Light / Dark</h3><div class="btnrow"><button class="barbtn" onclick="toggleTheme()">Toggle</button></div><p class="help">Pick a full color scheme below — these change the whole dashboard, not just the buttons.</p></div></div><div class="panel"><h3>🎨 Color Schemes</h3><p class="help" style="margin-bottom:12px">Each scheme restyles the entire app. Pick one or set a custom accent.</p><div class="themegrid">${Object.entries(SCHEMES).map(([k,s])=>`<div class="themecard ${S.scheme===k&&!S.accent?'active':''}" onclick="setScheme('${k}')"><div class="prev" style="background:${s.bg};border:1px solid ${s.line}"><span class="chip" style="background:${s.panel2}"></span><span class="chip" style="background:${s.accent}"></span></div><div style="font-weight:600;font-size:13px">${s.name}</div></div>`).join('')}</div><div style="display:flex;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap"><div><label style="font-size:12px;color:var(--muted);font-weight:600">Custom accent color</label><br><input type="color" id="customColor" value="${S.accent||accentHex()}" onchange="setAccent(this.value)" style="height:42px;width:80px;padding:4px;margin-top:4px"></div><div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Live preview</div><button class="btn btn-primary" style="flex:0;padding:9px 22px">Button</button></div></div><button class="btn btn-primary" style="margin-top:16px" onclick="toast('Display settings saved')">Save Accessibility</button></div>`;}
function saveLogo(){if(imgBuf.logoImg!==undefined){S.logo=imgBuf.logoImg;S.logoRemoved=false}save();updateStorePill();renderDisplay();toast('Logo saved');}
function removeLogo(){S.logo='';S.logoRemoved=true;imgBuf.logoImg=undefined;save();renderDisplay();toast('Logo removed')}
function setScheme(k){S.scheme=k;S.accent='';save();applyTheme();renderDisplay()}
function setAccent(v){S.accent=v;save();applyTheme();renderDisplay()}

function renderSettings(){document.getElementById('view-settings').innerHTML=`<div class="row2"><div class="panel"><h3>🏪 Store Information</h3><div class="field"><label>Business Type</label><select id="sBiz">${Object.entries(BIZ).map(([k,b])=>`<option value="${k}" ${k===S.businessType?'selected':''}>${b.emoji} ${b.label}</option>`).join('')}</select></div><div class="field"><label>Store Name</label><input id="sName" value="${esc(S.storeName)}"></div><div class="field"><label>Tagline</label><input id="sTag" value="${esc(S.tagline||'')}"></div><div class="field"><label>Address</label><input id="sAddr" value="${esc(S.address)}"></div><div class="row2"><div class="field"><label>Phone</label><input id="sPhone" value="${esc(S.phone)}"></div><div class="field"><label>Currency</label><input id="sCur" value="${esc(S.currency)}"></div></div><div class="row2"><div class="field"><label>NTN</label><input id="sNtn" value="${esc(S.ntn||'')}"></div><div class="field"><label>STRN</label><input id="sStrn" value="${esc(S.strn||'')}"></div></div><div class="field"><label>Receipt Footer</label><textarea id="sFooter" rows="2">${esc(S.footer||'')}</textarea></div><button class="btn btn-primary" onclick="saveSettings()">Save Store Settings</button></div><div><div class="panel"><h3>⚙️ Tax, Invoice & Scanner</h3><div class="field"><label>Tax Mode</label><select id="sInc"><option value="false" ${!S.taxInclusive?'selected':''}>Tax Exclusive (added on top)</option><option value="true" ${S.taxInclusive?'selected':''}>Tax Inclusive</option></select></div><div class="row2"><div class="field"><label>Low Stock Alert</label><input id="sLow" type="number" inputmode="decimal" value="${S.lowStockThreshold}"></div><div class="field"><label>Receipt / Printer</label><select id="sSize"><option value="thermal" ${S.receiptSize==='thermal'?'selected':''}>Black Copper 80mm Thermal</option><option value="a4" ${S.receiptSize==='a4'?'selected':''}>A4 / Letter</option></select></div></div><div class="row2"><div class="field"><label>Invoice Prefix</label><input id="sInvPre" value="${esc(S.invoicePrefix||'INV')}"></div><div class="field"><label>Next Invoice #</label><input value="${(S.invoicePrefix||'INV')+'-'+((S.invoiceCounter||1000)+1)}" readonly></div></div><label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px"><input type="checkbox" id="sScan" ${S.barcodeScanner?'checked':''} style="width:auto"> Enable barcode scanner</label><div class="field"><label>WhatsApp Country Code</label><input id="sWa" value="${esc(S.whatsappCountry||'92')}"></div><button class="btn btn-primary" onclick="saveSettings()">Save Configuration</button></div><div class="panel"><h3>☁️ Cloud Sync (Firebase) — desktop + phones</h3><p class="help" style="margin-bottom:10px">Connect every till and phone to ONE live database (real-time). Paste your free Firebase config (see SETUP-FIREBASE guide).</p><div class="field"><label>Firebase config (paste snippet or JSON)</label><textarea id="sFb" rows="6" placeholder='{ "apiKey": "…", "authDomain": "…", "projectId": "…", "appId": "…" }'>${S.fbConfig?esc(JSON.stringify(S.fbConfig,null,1)):''}</textarea></div><div class="field"><label>Store ID (same on every device)</label><input id="sStoreId" value="${esc(S.storeId||'main')}"></div><div class="btnrow"><button class="barbtn green" onclick="saveFirebase()">Connect Cloud</button><button class="barbtn blue" onclick="forcePush()">⬆ Send my data to cloud</button><button class="barbtn" onclick="cloudStatus()">Status</button></div><p class="help" style="margin-top:8px" id="fbStatusLine">${cloudOn?'✓ Connected':'Not connected'}</p></div><div class="panel"><h3>💾 Local Backup</h3><div class="btnrow" style="margin-bottom:8px"><button class="barbtn blue" onclick="exportData()">⬇ Backup (JSON)</button><label class="barbtn" style="cursor:pointer">⬆ Restore<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label></div><button class="barbtn red" style="width:100%" onclick="resetData()">⚠ Reset All Data</button></div></div></div><div class="panel"><h3>📋 Tax Slabs</h3><div class="tablewrap" style="max-height:none"><table><thead><tr><th>Name</th><th>Rate %</th><th>Type</th><th></th></tr></thead><tbody>${TAXES.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.rate}%</td><td>${t.builtin?'<span class="tag blue">Preset</span>':'<span class="tag green">Custom</span>'}</td><td style="white-space:nowrap"><button class="barbtn" style="padding:5px 9px" onclick="openTaxModal('${t.id}')">✎</button>${t.builtin?'':`<button class="ci-del" onclick="deleteTax('${t.id}')">🗑</button>`}</td></tr>`).join('')}</tbody></table></div><button class="barbtn green" style="margin-top:12px" onclick="openTaxModal()">+ Add Custom Tax Slab</button></div>`;}
function saveSettings(){if(document.getElementById('sName')){S.businessType=document.getElementById('sBiz').value;S.storeName=document.getElementById('sName').value;S.tagline=document.getElementById('sTag').value;S.address=document.getElementById('sAddr').value;S.phone=document.getElementById('sPhone').value;S.currency=document.getElementById('sCur').value||'Rs';S.ntn=document.getElementById('sNtn').value;S.strn=document.getElementById('sStrn').value;S.footer=document.getElementById('sFooter').value;S.taxInclusive=document.getElementById('sInc').value==='true';S.lowStockThreshold=parseInt(document.getElementById('sLow').value)||5;S.receiptSize=document.getElementById('sSize').value;S.whatsappCountry=document.getElementById('sWa').value||'92';S.invoicePrefix=document.getElementById('sInvPre').value.trim()||'INV';S.barcodeScanner=document.getElementById('sScan').checked;}save();updateStorePill();applyBiz();renderCart();toast('Settings saved')}
function openTaxModal(id){const t=id?TAXES.find(x=>x.id===id):{name:'',rate:''};modal(`<div class="modal-head"><h3>${id?'Edit':'Add'} Tax Slab</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Slab Name</label><input id="tName" value="${esc(t.name||'')}" placeholder="e.g. FED 15%"></div><div class="field"><label>Rate (%)</label><input id="tRate" type="number" inputmode="decimal" step="0.01" value="${t.rate}"></div></div><div class="modal-foot"><button class="btn btn-ghost" style="flex:0;padding:10px 18px" onclick="closeModal()">Cancel</button><button class="btn btn-primary" style="flex:0;padding:10px 22px" onclick="saveTax('${id||''}')">Save</button></div>`);}
function saveTax(id){const name=document.getElementById('tName').value.trim();const rate=parseFloat(document.getElementById('tRate').value);if(!name||isNaN(rate)){toast('Name and rate required',true);return}if(id){const t=TAXES.find(x=>x.id===id);t.name=name;t.rate=rate}else{TAXES.push({id:uid('tax'),name,rate,builtin:false})}save();closeModal();renderSettings();toast('Tax slab saved')}
function deleteTax(id){if(PRODUCTS.some(p=>p.taxId===id)){toast('In use by products — reassign first',true);return}TAXES=TAXES.filter(t=>t.id!==id);save();renderSettings();toast('Deleted')}

const EL=(typeof window!=='undefined'&&window.novapos&&window.novapos.isElectron);
let cloudOn=false,fbApp=null,fbDb=null,fbUnsub=null,applyingRemote=false,lastCloudExported=0,pushTimer=null;
function backupPayload(){return {settings:S,taxes:TAXES,products:PRODUCTS,customers:CUSTOMERS,users:USERS,sales:SALES,held:HELD,lost:LOST,requests:REQUESTS,exported:new Date().toISOString(),app:'3SVersePOS'}}
function applyBackup(d){if(d.settings){const keep={fbConfig:S.fbConfig,storeId:S.storeId,scheme:S.scheme,accent:S.accent};S=Object.assign({},DEFAULT_SETTINGS,d.settings,keep)}if(d.taxes)TAXES=d.taxes;if(d.products)PRODUCTS=d.products.map(p=>Object.assign({piecesPerBox:1,boxPrice:0},p));if(d.customers)CUSTOMERS=d.customers;if(d.users)USERS=d.users;if(d.sales)SALES=d.sales;if(d.held)HELD=d.held;if(d.lost)LOST=d.lost;if(d.requests)REQUESTS=d.requests;if(!S.skuCounters)S.skuCounters={};DB.set('settings',S);DB.set('taxes',TAXES);DB.set('products',PRODUCTS);DB.set('customers',CUSTOMERS);DB.set('users',USERS);DB.set('sales',SALES);DB.set('held',HELD);DB.set('lost',LOST);DB.set('requests',REQUESTS);curCustomer=(CUSTOMERS.find(c=>c.walkin)||CUSTOMERS[0]||{}).id;}
function parseFbConfig(txt){if(!txt)return null;try{return JSON.parse(txt)}catch(e){}try{const m=txt.match(/\{[\s\S]*\}/);if(m)return (new Function('return '+m[0]))();}catch(e){}return null;}
function saveFirebase(){const cfg=parseFbConfig(document.getElementById('sFb').value);if(!cfg||!cfg.apiKey||!cfg.projectId){toast('Could not read Firebase config — paste the full snippet',true);return}S.fbConfig=cfg;S.storeId=(document.getElementById('sStoreId').value||'main').trim();save();initFirebase(true);}
function initFirebase(announce){if(!S.fbConfig){updateSyncPill();return}if(typeof firebase==='undefined'){toast('Firebase library not loaded (need internet)',true);return}try{if(!fbApp)fbApp=firebase.initializeApp(S.fbConfig);fbDb=firebase.firestore();cloudOn=true;subscribeCloud();updateSyncPill();if(announce)toast('✓ Cloud connected');}catch(e){cloudOn=false;updateSyncPill();toast('Firebase error: '+(e&&e.message||'config'),true)}}
function subscribeCloud(){if(!fbDb)return;const ref=fbDb.collection('stores').doc(S.storeId||'main');if(fbUnsub)fbUnsub();fbUnsub=ref.onSnapshot(snap=>{if(!snap.exists){pushCloud();return}if(snap.metadata.hasPendingWrites)return;const d=snap.data();if(!d||!d.payload)return;let pd;try{pd=JSON.parse(d.payload)}catch(e){return}const t=Date.parse(pd.exported||'')||0;if(t<=lastCloudExported)return;lastCloudExported=t;applyingRemote=true;applyBackup(pd);applyingRemote=false;updateStorePill();applyBiz();renderCart();updateReqBadge();const open=document.querySelector('.navbtn.active');if(open&&currentUser)nav(open.dataset.view);toast('🔄 Synced from cloud');},err=>{cloudOn=false;updateSyncPill();});}
function pushCloud(){if(!cloudOn||applyingRemote||!fbDb)return;const payload=backupPayload();lastCloudExported=Date.parse(payload.exported)||Date.now();fbDb.collection('stores').doc(S.storeId||'main').set({payload:JSON.stringify(payload),exported:payload.exported,updatedBy:(currentUser&&currentUser.name)||'',ts:Date.now()}).catch(()=>{});}
function schedulePush(){if(!cloudOn||applyingRemote)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,700);}
function forcePush(){if(!cloudOn||!fbDb){toast('Connect cloud first',true);return}pushCloud();toast('Sent this device data to the cloud');}
function cloudStatus(){toast(cloudOn?'Cloud connected · store "'+(S.storeId||'main')+'"':'Not connected')}
function updateSyncPill(){const p=document.getElementById('syncPill');if(!p)return;if(cloudOn){p.textContent='☁️ Cloud: live';p.className='pill sync ok'}else if(S.fbConfig){p.textContent='☁️ Cloud: …';p.className='pill sync'}else{p.textContent='☁️ Cloud: off';p.className='pill sync'}}

function exportData(){const blob=new Blob([JSON.stringify(backupPayload(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='3sverse-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{applyBackup(JSON.parse(r.result));schedulePush();updateStorePill();applyBiz();renderSettings();renderCart();toast('Backup restored')}catch(err){toast('Invalid backup file',true)}};r.readAsText(f)}
function resetData(){if(!confirm('This erases ALL data and restores demo defaults. Continue?'))return;localStorage.clear();location.reload()}

function modal(html,cls){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${cls||''}">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function updateStorePill(){const b=BIZ[S.businessType]||BIZ.retail;document.getElementById('storePill').textContent=b.emoji+' '+S.storeName;document.title=S.storeName+' — 3S Verse POS';}
function tickClock(){document.getElementById('clock').textContent='🕐 '+new Date().toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
setInterval(tickClock,1000);tickClock();

let scanGlobal='',scanTimer=null;
document.addEventListener('keydown',e=>{
  if(document.getElementById('loginScreen').style.display!=='none'){if(e.key==='Enter')doLogin();return;}
  if(e.key==='F2'){e.preventDefault();if(can('sales')){nav('pos');document.getElementById('search').focus()}return}
  if(e.key==='F4'){e.preventDefault();holdSale();return}
  if(e.key==='F9'){e.preventDefault();if(cart.length)openCheckout();return}
  if(e.key==='Escape'){closeModal();return}
  const ae=document.activeElement;const tag=ae&&ae.tagName;const inField=(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA');
  if(ae&&ae.id==='search'&&e.key==='Enter'){const q=document.getElementById('search').value.trim();if(q){handleScan(q);document.getElementById('search').value='';renderProducts()}return}
  if(!inField&&!document.getElementById('view-pos').classList.contains('hidden')&&S.barcodeScanner){
    if(e.key==='Enter'){if(scanGlobal.length>=3)handleScan(scanGlobal);scanGlobal='';return}
    if(e.key.length===1&&/[A-Za-z0-9\-]/.test(e.key)){scanGlobal+=e.key;clearTimeout(scanTimer);scanTimer=setTimeout(()=>scanGlobal='',150)}
  }
});

applyTheme();updateStorePill();applyBiz();renderProducts();renderCart();
if(S.fbConfig){setTimeout(()=>initFirebase(false),400)}else{updateSyncPill()}
startSession();
if(typeof EL!=='undefined'&&!EL&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
