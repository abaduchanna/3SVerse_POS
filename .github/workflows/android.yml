name: Build 3S Verse POS Android APK
on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        # android-actions/setup-android@v3 became unreliable on runner images
        # with cmdline-tools 16.0 ("Failed to find package 'tools'" -> exit 1).
        # The ubuntu-latest image already ships the Android SDK; Capacitor's
        # Gradle build auto-installs any missing platform/build-tools once
        # licenses are accepted.
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -n "$SDKM" ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          else
            echo "sdkmanager not found; relying on preinstalled licenses"
          fi
      - name: Assemble Capacitor app from phone/ and build APK
        run: |
          set -e
          mkdir -p capapp/www
          cp -r phone/* capapp/www/
          cd capapp
          echo '{"name":"threesverse-pos","version":"1.0.0","devDependencies":{"@capacitor/cli":"^6.1.2"},"dependencies":{"@capacitor/core":"^6.1.2","@capacitor/android":"^6.1.2"}}' > package.json
          echo '{"appId":"com.threesverse.pos","appName":"3S Verse POS","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npm install
          npx --yes cap add android
          mkdir -p assets
          cp www/assets/icon-only.png assets/icon-only.png || true
          cp www/assets/icon-foreground.png assets/icon-foreground.png || true
          cp www/assets/icon-background.png assets/icon-background.png || true
          cp www/assets/splash.png assets/splash.png || true
          cp www/assets/splash-dark.png assets/splash-dark.png || true
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0E1116' --iconBackgroundColorDark '#0E1116' --splashBackgroundColor '#0E1116' --splashBackgroundColorDark '#0E1116' || true
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      # Release assets do NOT count against the artifact storage quota,
      # so upload-artifact is intentionally NOT used (same as Studio repo).
      - name: Read version from package.json
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Rename APK for release
        run: |
          mkdir -p rel
          cp capapp/android/app/build/outputs/apk/debug/app-debug.apk "rel/3SVerse-POS-Android.apk"
          ls -la rel/

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: pos-v${{ env.VERSION }}
          name: 3S Verse POS v${{ env.VERSION }}
          body: |
            Automated build of commit ${{ github.sha }}.

            - `3SVerse-POS-Setup.exe` - Windows installer (NSIS)
            - `3SVerse-POS-Portable.exe` - Windows portable, no install needed
            - `3SVerse-POS-Android.apk` - Android app (side-load)
          files: rel/3SVerse-POS-Android.apk
          allow_updates: true
          make_latest: true
