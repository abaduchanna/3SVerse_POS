name: Build 3S Verse POS Android APK
on:
  push:
  workflow_dispatch: {}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Assemble Capacitor app from phone/ and build APK
        run: |
          set -e
          mkdir -p capapp/www
          cp -r phone/* capapp/www/
          cd capapp
          echo '{"name":"threesverse-pos","version":"1.0.0","devDependencies":{"@capacitor/cli":"^6.1.2"},"dependencies":{"@capacitor/core":"^6.1.2","@capacitor/android":"^6.1.2"}}' > package.json
          echo '{"appId":"com.threesverse.pos","appName":"3S Verse POS","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npm install
          npx --yes cap add android
          mkdir -p assets
          cp www/assets/icon-only.png assets/icon-only.png || true
          cp www/assets/icon-foreground.png assets/icon-foreground.png || true
          cp www/assets/icon-background.png assets/icon-background.png || true
          cp www/assets/splash.png assets/splash.png || true
          cp www/assets/splash-dark.png assets/splash-dark.png || true
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0E1116' --iconBackgroundColorDark '#0E1116' --splashBackgroundColor '#0E1116' --splashBackgroundColorDark '#0E1116' || true
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 3SVerse-POS-Android-APK
          path: capapp/android/app/build/outputs/apk/debug/app-debug.apk
