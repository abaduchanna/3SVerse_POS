<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>3SVerse POS</title>
<style>
html,body{margin:0;height:100%;background:#07060b;overflow:hidden;-webkit-user-select:none;user-select:none}
img{display:block;width:640px;height:400px}
.bar{position:fixed;left:60px;right:60px;top:346px;height:2px;border-radius:2px;background:#221e32;overflow:hidden}
.bar i{display:block;height:100%;width:34%;border-radius:2px;background:linear-gradient(90deg,#61e6f2,#b57cf4,#e83dcc);animation:run 1.3s ease-in-out infinite}
.msg{position:fixed;left:60px;top:322px;font:11px/1 Segoe UI,Roboto,sans-serif;letter-spacing:.14em;color:#8b87a0}
@keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
</style></head>
<body><img src="splash.png" alt=""><div class="msg">STARTING…</div><div class="bar"><i></i></div></body></html>
