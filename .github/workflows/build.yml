name: Build 3S Verse POS Windows EXE
on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - name: Protect application sources (compile to V8 bytecode)
        shell: bash
        timeout-minutes: 10
        run: |
          node protect.js prepare
          ELECTRON_RUN_AS_NODE=1 npx electron compile.js
          node protect.js finish

      - run: npm run dist -- --publish never
        env:
          GH_TOKEN: ""

      # Release assets do NOT count against the artifact storage quota,
      # so upload-artifact is intentionally NOT used (same as Studio repo).
      # Single source of truth: version comes from package.json.
      - name: Read version from package.json
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "building POS v$v"

      - name: Attach EXE to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: pos-v${{ env.VERSION }}
          name: 3S Verse POS v${{ env.VERSION }}
          body: |
            Automated build of commit ${{ github.sha }}.

            - `3SVerse-POS-Setup-*.exe` - Windows installer (NSIS)
            - `3SVerse-POS-Portable-*.exe` - Windows portable, no install needed
            - `3SVerse-POS-Android-*.apk` - Android app (side-load)
          files: dist/*.exe
          allow_updates: true
          make_latest: true
